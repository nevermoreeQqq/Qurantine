name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check native Windows launch
        run: node tools/verify-windows.cjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Quarantine-Windows-x64
          path: release/Quarantine-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
